version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      build-tooling:
        applies-to: version-updates
        patterns:
          - vite
          - "@vitejs/plugin-react"
        update-types:
          - minor
          - patch
      browser-automation:
        applies-to: version-updates
        patterns:
          - playwright-core
          - puppeteer-core
        update-types:
          - minor
          - patch
      quality-tooling:
        applies-to: version-updates
        patterns:
          - axe-core
          - happy-dom
          - publint
        update-types:
          - minor
          - patch
      type-definitions:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: electron
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

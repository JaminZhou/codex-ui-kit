name: npm publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved exact non-preview version (publishes to latest)
        required: true
        type: string
      source_sha:
        description: Approved full source SHA (must still be current main)
        required: true
        type: string
      candidate_run_id:
        description: Successful npm release candidate run ID
        required: true
        type: string
      integrity:
        description: Approved complete sha512- integrity from that candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SHA: ${{ inputs.source_sha }}
  RELEASE_INTEGRITY: ${{ inputs.integrity }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}

jobs:
  verify:
    if: github.repository == 'JaminZhou/codex-ui-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - id: select
        name: Require current CI and exact successful candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/trusted-release.mjs select
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - id: artifact
        run: node scripts/trusted-release.mjs artifact
      - name: Isolate pnpm store
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Test approved bytes without publishing permission
        env:
          RELEASE_ARCHIVE: ${{ steps.artifact.outputs.tarball }}
        run: |
          node scripts/react-compatibility-smoke.mjs 18.3.1 18.3.1 18.3.27 18.3.7 Bundler --tarball "$RELEASE_ARCHIVE"
          node scripts/react-compatibility-smoke.mjs 19.2.7 19.2.7 19.2.17 19.2.3 NodeNext --tarball "$RELEASE_ARCHIVE"
          RELEASE_CONSUMER_INSTALLER=pnpm node scripts/react-compatibility-smoke.mjs 19.2.7 19.2.7 19.2.17 19.2.3 NodeNext --tarball "$RELEASE_ARCHIVE"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Pin OIDC-capable npm without installing the project
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.6.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - id: artifact
        name: Recheck source, registry and approved bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/trusted-release.mjs gate
          node scripts/trusted-release.mjs artifact
          node scripts/trusted-release.mjs oidc-before
      - id: publish
        name: Publish the approved archive using npm OIDC
        env:
          RELEASE_ARCHIVE: ${{ steps.artifact.outputs.tarball }}
        run: npm publish "$RELEASE_ARCHIVE" --tag latest --access public --registry=https://registry.npmjs.org/ --ignore-scripts
      - name: Read registry tags and compare downloaded bytes
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        run: node scripts/trusted-release.mjs after
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        with:
          name: npm-publication-registry-${{ inputs.version }}
          path: |
            artifacts/registry-before.json
            artifacts/publication.json
          if-no-files-found: error
          retention-days: 90

  registry-consumers:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Isolate pnpm store
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install exact registry bytes in fresh npm and pnpm consumers
        run: |
          node scripts/react-compatibility-smoke.mjs 18.3.1 18.3.1 18.3.27 18.3.7 Bundler --registry-version "$RELEASE_VERSION"
          node scripts/react-compatibility-smoke.mjs 19.2.7 19.2.7 19.2.17 19.2.3 NodeNext --registry-version "$RELEASE_VERSION"
          RELEASE_CONSUMER_INSTALLER=pnpm node scripts/react-compatibility-smoke.mjs 19.2.7 19.2.7 19.2.17 19.2.3 NodeNext --registry-version "$RELEASE_VERSION"

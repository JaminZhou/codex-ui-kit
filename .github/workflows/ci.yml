name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest run for a given PR or branch.  The Electron acceptance
# job is intentionally expensive; stale pushes should not consume a runner and
# leave the current commit waiting behind obsolete work.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Public pull requests must never execute untrusted code on a personal self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Isolate pnpm store
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Audit the packed release candidate
        run: pnpm check:release:candidate

  consumer:
    name: React ${{ matrix.react }} / ${{ matrix.module-resolution }} consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: "18"
            react-version: "18.3.1"
            react-dom-version: "18.3.1"
            react-types-version: "18.3.27"
            react-dom-types-version: "18.3.7"
            module-resolution: Bundler
          - react: "19"
            react-version: "19.2.7"
            react-dom-version: "19.2.7"
            react-types-version: "19.2.17"
            react-dom-types-version: "19.2.3"
            module-resolution: Bundler
          - react: "19"
            react-version: "19.2.7"
            react-dom-version: "19.2.7"
            react-types-version: "19.2.17"
            react-dom-types-version: "19.2.3"
            module-resolution: NodeNext
    steps:
      - uses: actions/checkout@v7
      - name: Isolate pnpm store
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          node scripts/react-compatibility-smoke.mjs \
            ${{ matrix.react-version }} \
            ${{ matrix.react-dom-version }} \
            ${{ matrix.react-types-version }} \
            ${{ matrix.react-dom-types-version }} \
            ${{ matrix.module-resolution }}

  codex-app-acceptance:
    name: Codex app / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cdp
            command: check:cdp
          - suite: electron
            command: check:electron
          - suite: visual-1
            command: check:visual --shard=1/4
          - suite: visual-2
            command: check:visual --shard=2/4
          - suite: visual-3
            command: check:visual --shard=3/4
          - suite: visual-4
            command: check:visual --shard=4/4
    # Native scrollbar rendering is part of the macOS 26 visual baseline.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CODEX_UI_KIT_ELECTRON_PROGRESS: "1"
      CODEX_UI_KIT_VISUAL_CONCURRENCY: "2"
    steps:
      - name: Match baseline overlay scrollbar preference
        # Baselines use overlay scrollbars. Runner images may default to Always,
        # which reserves 15px and changes centered layouts and line wrapping.
        run: |
          sw_vers
          defaults write NSGlobalDomain AppleShowScrollBars -string WhenScrolling
          test "$(defaults read NSGlobalDomain AppleShowScrollBars)" = WhenScrolling
      - uses: actions/checkout@v7
      - name: Isolate pnpm store
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build acceptance app
        run: pnpm build && pnpm --filter @codex-ui-kit/codex-app-playground build
      - name: Verify Electron session isolation and cleanup
        if: matrix.suite == 'cdp'
        run: pnpm --filter @codex-ui-kit/codex-app-playground check:harness
      - name: Run acceptance contracts
        run: pnpm --filter @codex-ui-kit/codex-app-playground ${{ matrix.command }}
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codex-app-failure-${{ matrix.suite }}-${{ github.run_id }}
          path: |
            playgrounds/codex-app/artifacts/visual
            playgrounds/codex-app/artifacts/cdp
          retention-days: 7

  # Keep the existing required check name, but never let a failed, cancelled or
  # skipped acceptance job be reported as a green merge gate.
  check:
    if: always()
    needs: [quality, consumer, codex-app-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.CI_RESULTS);
          for (const [name, { result }] of Object.entries(results)) {
            console.log(`${name}: ${result}`);
            if (result !== "success") process.exitCode = 1;
          }
          JS
